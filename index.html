<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commande Souvenirs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .categorie {
      margin-top: 40px;
    }
    .produits {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: stretch; /* toutes les cartes de la ligne s'étirent à la même hauteur */
    }
    .produit {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
      width: 150px;
      /* pas de hauteur fixe : la carte s'étire seulement autant que nécessaire */
      text-align: center;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .produit-image {
      width: 100%;
      height: 150px;              /* zone image plus grande, même taille pour tous */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .produit img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;        /* l'image garde ses proportions sans déformer la grille */
    }
    .produit-nom {
      font-size: 0.85em;
      line-height: 1.2;
      min-height: 2.1em;          /* réserve la place de 2 lignes courtes seulement */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-shrink: 0;
    }
    .produit-prix {
      font-weight: bold;
      margin: 2px 0;
      flex-shrink: 0;
    }
    .produit-bas {
      margin-top: auto;           /* pousse toujours le bloc quantité/rupture tout en bas de la carte */
      flex-shrink: 0;
      padding-top: 4px;
    }
    .stock-info {
      color: red;
      font-size: 0.85em;
      margin: 2px 0;
    }
    .rupture-stock {
      color: red;
      font-weight: bold;
      font-size: 0.85em;
      margin-top: 6px;
      border: 1px solid red;
      border-radius: 4px;
      padding: 4px 2px;
      background: #ffecec;
    }
    .quantity-input {
      width: 60px;
      margin-top: 6px;
    }
    .quantity-input.qty-error {
      border: 1px solid red;
      background: #ffecec;
    }
    .qty-error-msg {
      color: red;
      font-size: 0.75em;
      display: none;
    }
    .client-select, .total, .export {
      text-align: center;
      margin-top: 20px;
    }
    .total {
      font-weight: bold;
    }
    .note {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 6px;
      font-weight: normal;
    }
    .tarif-box {
      max-width: 500px;
      margin: 0 auto 20px;
      padding: 12px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
      font-size: 16px;
      line-height: 1.5;
    }
    .banner-categorie {
      display: block;
      max-width: 600px;
      width: 100%;
      margin: 10px auto 20px;
      border-radius: 8px;
    }
    .produit-prix .prix-barre {
      text-decoration: line-through;
      color: #888;
      font-weight: normal;
      font-size: 0.9em;
      margin-right: 4px;
    }
    .produit-prix .prix-remise {
      color: #1a7a1a;
    }
    .remise-info {
      text-align: center;
      color: #1a7a1a;
      font-weight: normal;
      font-size: 0.9em;
      margin-top: 10px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h1>Commande Souvenirs</h1>
  <div class="client-select">
    <label for="client">Client :</label>
    <input type="text" id="client" placeholder="Nom du client" />
  </div>

  <div id="produitsContainer"></div>

  <div class="total" id="total">
    Total HT : 0 CFP
    <br />TVA (16%) : 0 CFP
    <br />TOTAL TTC : 0 CFP
  </div>
  <div class="remise-info" id="remiseInfo"></div>

  <div class="export">
    <button onclick="exportPDF()">Exporter en PDF</button>
    <button onclick="envoyerCommande()">Envoyer la commande</button>
  </div>

<script>
const produits = [
  { id: 1, nom: "Bo_Mag_Flag", prix: 345, image: "images/bo-mag-flag.png", categorie: "Décapsuleurs" },
  { id: 2, nom: "Bo_Mag_Rai", prix: 345, image: "images/bo-mag-rai.png", categorie: "Décapsuleurs" },
  { id: 3, nom: "Bo_Mag_Tor", prix: 345, image: "images/bo-mag-tor.png", categorie: "Décapsuleurs" },
  { id: 4, nom: "Bo_Pc_Flag", prix: 345, image: "images/bo-pc-flag.png", categorie: "Décapsuleurs" },
  { id: 5, nom: "Bo_Pc_Rai", prix: 345, image: "images/bo-pc-rai.png", categorie: "Décapsuleurs" },
  { id: 6, nom: "Bo_Pc_Tor", prix: 345, image: "images/bo-pc-tor.png", categorie: "Décapsuleurs" },
  { id: 7, nom: "REMAG_BALEINE (stock = 0)", prix: 300, image: "images/Remag-baleine.png", categorie: "Magnets résine" },
  { id: 8, nom: "REMAG_TORTUETIKI (stock = 0)", prix: 300, image: "images/Remag-tortuetiki.png", categorie: "Magnets résine" },
  { id: 9, nom: "REMAG_TIKI (stock = 0)", prix: 300, image: "images/Remag-tiki.png", categorie: "Magnets résine" },
  { id: 10, nom: "REMAG_VAA (stock = 0)", prix: 300, image: "images/Remag-vaa.png", categorie: "Magnets résine" },
  { id: 11, nom: "REMAG_VAHINE_1 (stock = 1)", prix: 300, image: "images/Remag-vahine1.png", categorie: "Magnets résine" },
  { id: 12, nom: "REMAG_VAHINE_2 (stock = 0)", prix: 300, image: "images/Remag-vahine2.png", categorie: "Magnets résine" },
  { id: 13, nom: "REMAG_DRAPEAU (stock = 0)", prix: 300, image: "images/Remag-drapeau.png", categorie: "Magnets résine" },
  { id: 14, nom: "REMAG_PIECE (stock = 0)", prix: 300, image: "images/Remag-piece.png", categorie: "Magnets résine" },
  { id: 15, nom: "COA_LEZ (stock = 43)", prix: 95, image: "images/coa-lez.png", categorie: "Dessous de verre" },
  { id: 16, nom: "COA_FLAG", prix: 95, image: "images/coa-flag.png", categorie: "Dessous de verre" },
  { id: 17, nom: "COA_HIB", prix: 95, image: "images/coa-hib.png", categorie: "Dessous de verre" },
  { id: 18, nom: "COA_PAT (stock = 2)", prix: 95, image: "images/coa-pat.png", categorie: "Dessous de verre" },
  { id: 19, nom: "COA_RAI", prix: 95, image: "images/coa-rai.png", categorie: "Dessous de verre" },
  { id: 20, nom: "COA_TOR", prix: 95, image: "images/coa-tor.png", categorie: "Dessous de verre" },
  { id: 21, nom: "COA_VAH (Stock = 0)", prix: 95, image: "images/coa-vah.png", categorie: "Dessous de verre" },
  { id: 22, nom: "COA_BAL (Stock = 0)", prix: 95, image: "images/coa-bal.png", categorie: "Dessous de verre" },
  { id: 23, nom: "COAB_FLAG ", prix: 430, image: "images/coa-flag.png", categorie: "Dessous de plat" },
  { id: 24, nom: "COAB_RAI (Stock = 0)", prix: 430, image: "images/coa-rai.png", categorie: "Dessous de plat" },
  { id: 25, nom: "COAB_TOR (Stock = 66)", prix: 430, image: "images/coa-tor.png", categorie: "Dessous de plat" },
  { id: 26, nom: "Mir_Comp_Flag", prix: 345, image: "images/mir-comp-flag.png", categorie: "Miroirs" },
  { id: 27, nom: "Mir_Comp_Hib", prix: 345, image: "images/mir-comp-hib.png", categorie: "Miroirs" },
  { id: 28, nom: "Mir_Comp_Rai", prix: 345, image: "images/mir-comp-rai.png", categorie: "Miroirs" },
  { id: 29, nom: "Mir_Comp_Tor", prix: 345, image: "images/mir-comp-tor.png", categorie: "Miroirs" },
  { id: 30, nom: "Shot_box_1_(Lezard-Tortue01-Raie)", prix: 520, image: "images/shot-box-1.png", categorie: "Boîtes de shooters" },
  { id: 31, nom: "Shot_box_2_(Hibiscus-Tortue02-Drapeau)", prix: 520, image: "images/shot-box-2.png", categorie: "Boîtes de shooters" },
  { id: 32, nom: "Stc_bal (stock = 500)", prix: 250, image: "images/stick-bal-graph.png", categorie: "Stickers" },
  { id: 33, nom: "Stc_tor (stock = 500)", prix: 250, image: "images/stick-tor-graph.png", categorie: "Stickers" },
  { id: 34, nom: "Stc_rai (stock = 500)", prix: 250, image: "images/stick-rai-graph.png", categorie: "Stickers" },
  { id: 35, nom: "Stc_req (stock = 500)", prix: 250, image: "images/stick-req-graph.png", categorie: "Stickers" },
 // { id: 36, nom: "Sticker Requin ", prix: 300, image: "images/sticker-requin.png", categorie: "Stickers" },
//  { id: 37, nom: "Sticker Tortue (18x15 cm)", prix: 300, image: "images/sticker-tortue.png", categorie: "Stickers" },
//  { id: 38, nom: "Sticker Manta (13x18 cm)", prix: 300, image: "images/sticker-manta.png", categorie: "Stickers" },
//  { id: 39, nom: "Plaque divers (23x25 cm)", prix: 500, image: "images/sticker-plaque-divers.png", categorie: "Stickers" },
 // { id: 40, nom: "Pack 50 stickers", prix: 4000, image: "images/sticker-pack-50.png", categorie: "Stickers" }
];

// Détecte automatiquement une mention "(stock = N)" (insensible à la casse) dans le nom d'un produit.
// Si trouvée : produit.stock = N et produit.nomAffiche = nom nettoyé de cette mention.
// Si absente : pas de stock défini => pas de vérification pour ce produit.
const REGEX_STOCK = /\(\s*stock\s*=\s*(\d+)\s*\)/i;
produits.forEach(p => {
  const match = p.nom.match(REGEX_STOCK);
  if (match) {
    p.stock = parseInt(match[1]);
    p.nomAffiche = p.nom.replace(REGEX_STOCK, "").replace(/\s+/g, " ").trim();
  } else {
    p.nomAffiche = p.nom.trim();
  }
});

const tarifsGros = {
  "Décapsuleurs":       { seuil: 50,  prix: 310 },
  "Magnets résine":   { seuil: 200, prix: 250  },
  "Dessous de verre":   { seuil: 200, prix: 85  },
  "Dessous de plat":    { seuil: 50,  prix: 390 },
  "Miroirs":            { seuil: 50,  prix: 310 },
  "Boîtes de shooters": { seuil: 50,  prix: 450 },
  "Stickers":           { seuil: 100, prix: 225 }
};

const TVA_TAUX = 0.16;
const container = document.getElementById("produitsContainer");
const totalEl = document.getElementById("total");
const remiseInfoEl = document.getElementById("remiseInfo");

function afficherProduits() {
  const categories = {};
  produits.forEach(p => {
    if (!categories[p.categorie]) categories[p.categorie] = [];
    categories[p.categorie].push(p);
  });

  for (const [categorie, liste] of Object.entries(categories)) {
    const section = document.createElement("div");
    section.className = "categorie";
    const titre = document.createElement("h2");
    titre.textContent = categorie;
    section.appendChild(titre);

    if (categorie === "Boîtes de shooters") {
      const banner = document.createElement("img");
      banner.src = "images/shot-banner-box.png";
      banner.alt = "Boîtes de shooters";
      banner.className = "banner-categorie";
      section.appendChild(banner);
    }

    const regleGros = tarifsGros[categorie];
    if (regleGros) {
      const prixNormal = liste[0].prix;
      const tarifBox = document.createElement("div");
      tarifBox.className = "tarif-box";
      tarifBox.innerHTML = `
        <strong>Prix unitaire :</strong> ${prixNormal} CFP HT<br>
        <strong>Tarif de gros :</strong> ${regleGros.prix} CFP HT à partir de ${regleGros.seuil} unités
      `;
      section.appendChild(tarifBox);
    }

    const zone = document.createElement("div");
    zone.className = "produits";

    liste.forEach((produit) => {
      const div = document.createElement("div");
      div.className = "produit";

      const hasStock = typeof produit.stock === "number";
      const enRupture = hasStock && produit.stock <= 0;

      // Zone image à taille fixe (identique pour tous les produits)
      const imgWrap = document.createElement("div");
      imgWrap.className = "produit-image";
      const img = document.createElement("img");
      img.src = produit.image;
      img.alt = produit.nomAffiche;
      imgWrap.appendChild(img);

      const nom = document.createElement("div");
      nom.className = "produit-nom";
      nom.textContent = produit.nomAffiche;

      const prix = document.createElement("div");
      prix.className = "produit-prix";
      prix.dataset.prixNormal = produit.prix;
      if (tarifsGros[produit.categorie]) {
        prix.dataset.categorie = produit.categorie;
      }
      prix.textContent = produit.prix + " CFP HT";

      div.appendChild(imgWrap);
      div.appendChild(nom);
      div.appendChild(prix);

      // Bloc du bas (stock/quantité ou rupture) toujours aligné en bas de la carte
      const bas = document.createElement("div");
      bas.className = "produit-bas";

      if (hasStock && produit.stock > 0) {
        const stockInfo = document.createElement("div");
        stockInfo.className = "stock-info";
        stockInfo.textContent = "Stock : " + produit.stock;
        bas.appendChild(stockInfo);
      }

      if (enRupture) {
        const ruptureDiv = document.createElement("div");
        ruptureDiv.className = "rupture-stock";
        ruptureDiv.textContent = "REASSORT EN COURS";
        bas.appendChild(ruptureDiv);
      } else {
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.value = "0";
        input.className = "quantity-input";
        input.dataset.id = produit.id;

        if (hasStock) {
          input.max = produit.stock;
          input.dataset.stock = produit.stock;
        }

        input.addEventListener("input", () => {
          verifierStock(input);
          majAffichage();
        });
        bas.appendChild(input);

        const erreurDiv = document.createElement("div");
        erreurDiv.className = "qty-error-msg";
        erreurDiv.textContent = "Quantité max atteinte";
        bas.appendChild(erreurDiv);
      }

      div.appendChild(bas);
      zone.appendChild(div);
    });

    section.appendChild(zone);
    container.appendChild(section);
  }
}

// Empêche de saisir une quantité supérieure au stock disponible (quand un stock est précisé)
function verifierStock(input) {
  if (input.dataset.stock === undefined) return;
  const stock = parseInt(input.dataset.stock);
  let val = parseInt(input.value);
  if (isNaN(val) || val < 0) val = 0;

  const erreurDiv = input.parentElement.querySelector(".qty-error-msg");

  if (val > stock) {
    val = stock;
    if (erreurDiv) erreurDiv.style.display = "block";
    input.classList.add("qty-error");
  } else {
    if (erreurDiv) erreurDiv.style.display = "none";
    input.classList.remove("qty-error");
  }

  input.value = val;
}

function lirePanier() {
  const cart = [];
  document.querySelectorAll(".quantity-input").forEach(input => {
    verifierStock(input); // sécurité supplémentaire avant lecture du panier
    const qte = parseInt(input.value || "0");
    if (qte > 0) {
      const produit = produits.find(p => p.id == input.dataset.id);
      if (produit) cart.push({ produit, qte });
    }
  });
  return cart;
}

function quantitesParCategorie(cart) {
  const map = {};
  cart.forEach(({ produit, qte }) => {
    const cat = produit.categorie;
    if (!map[cat]) map[cat] = 0;
    map[cat] += qte;
  });
  return map;
}

function appliquerPrix(cart) {
  const qteCat = quantitesParCategorie(cart);
  return cart.map(({ produit, qte }) => {
    let prixUnitaire = produit.prix;
    const regle = tarifsGros[produit.categorie];
    if (regle && qteCat[produit.categorie] >= regle.seuil) {
      prixUnitaire = regle.prix;
    }
    const totalLigne = qte * prixUnitaire;
    return { id: produit.id, nom: produit.nomAffiche, categorie: produit.categorie, qte, prixBase: produit.prix, prixApplique: prixUnitaire, totalLigne };
  });
}

function calculerTotaux(lignes) {
  const totalHT = lignes.reduce((s, l) => s + l.totalLigne, 0);
  const tva = Math.round(totalHT * TVA_TAUX);
  const totalTTC = totalHT + tva;
  return { totalHT, tva, totalTTC };
}

// Calcule, pour chaque catégorie soumise à un tarif de gros, la quantité
// totale commandée et si le seuil est atteint.
function calculerEtatsGros(qteParCategorie) {
  const etats = {};
  Object.keys(tarifsGros).forEach(cat => {
    const regle = tarifsGros[cat];
    const qte = qteParCategorie[cat] || 0;
    etats[cat] = { qte, seuil: regle.seuil, prixRemise: regle.prix, active: qte >= regle.seuil };
  });
  return etats;
}

// Affiche le prix barré + le prix remisé en vert sur chaque carte produit
// dont la catégorie a atteint son seuil de tarif de gros.
function mettreAJourAffichagePrix(etatsGros) {
  document.querySelectorAll('.produit-prix[data-categorie]').forEach(prixDiv => {
    const cat = prixDiv.dataset.categorie;
    const etat = etatsGros[cat];
    const prixNormal = prixDiv.dataset.prixNormal;
    if (etat && etat.active) {
      prixDiv.innerHTML =
        '<span class="prix-barre">' + prixNormal + ' CFP HT</span>' +
        '<span class="prix-remise">' + etat.prixRemise + ' CFP HT</span>';
    } else {
      prixDiv.textContent = prixNormal + " CFP HT";
    }
  });
}

// Met à jour, en bas de page, une ligne par catégorie concernée dès
// qu'une quantité y est saisie : remise appliquée, ou quantité manquante
// pour l'atteindre.
function majRemiseInfoBas(etatsGros) {
  const lignes = [];
  Object.keys(tarifsGros).forEach(cat => {
    const etat = etatsGros[cat];
    if (etat.active) {
      lignes.push(
        cat + " : remise appliquée → " + etat.prixRemise +
        " CFP HT/u (" + etat.qte + " unités)"
      );
    } else if (etat.qte > 0) {
      const restant = etat.seuil - etat.qte;
      lignes.push(
        cat + " : plus que " + restant + " unité(s) pour atteindre " +
        etat.prixRemise + " CFP HT/u"
      );
    }
  });
  remiseInfoEl.innerHTML = lignes.join("<br>");
}

function majAffichage() {
  const cart = lirePanier();
  const lignes = appliquerPrix(cart);
  const totaux = calculerTotaux(lignes);
  totalEl.innerHTML =
    "Total HT : " + totaux.totalHT + " CFP" +
    "<br />TVA (16%) : " + totaux.tva + " CFP" +
    "<br />TOTAL TTC : " + totaux.totalTTC + " CFP";

  const qteParCategorie = quantitesParCategorie(cart);
  const etatsGros = calculerEtatsGros(qteParCategorie);
  mettreAJourAffichagePrix(etatsGros);
  majRemiseInfoBas(etatsGros);
}

async function exportPDF() {
  const client = document.getElementById('client').value.trim();
  if (!client) { alert('Veuillez saisir un client.'); return; }
  const cart = lirePanier();
  if (cart.length === 0) { alert('Aucun produit sélectionné.'); return; }
  const lignes = appliquerPrix(cart);
  const { totalHT, tva, totalTTC } = calculerTotaux(lignes);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 12;
  doc.text('Client : ' + client, 10, y); y += 8;
  doc.text('Date : ' + new Date().toLocaleString('fr-FR'), 10, y); y += 10;
  doc.text('Détails de la commande :', 10, y); y += 8;
  lignes.forEach(l => {
    doc.text(`${l.nom} — Qté ${l.qte} — PU ${l.prixApplique} CFP — Total ${l.totalLigne} CFP`, 10, y);
    y += 8;
    if (y > 280) { doc.addPage(); y = 12; }
  });
  y += 4;
  doc.text(`Total HT : ${totalHT} CFP`, 10, y); y += 8;
  doc.text(`TVA (16%) : ${tva} CFP`, 10, y); y += 8;
  doc.text(`TOTAL TTC : ${totalTTC} CFP`, 10, y);
  doc.save('commande_' + client.replace(/\s+/g, '_') + '.pdf');
}

function envoyerCommande() {
  const client = document.getElementById('client').value.trim();
  if (!client) { alert('Veuillez saisir un client.'); return; }
  const cart = lirePanier();
  if (cart.length === 0) { alert('Aucun produit sélectionné.'); return; }
  const lignes = appliquerPrix(cart);
  const { totalHT, tva, totalTTC } = calculerTotaux(lignes);
  let corps = `Commande de : ${client}\nDate : ${new Date().toLocaleString('fr-FR')}\n\nDétails :\n`;
  lignes.forEach(l => {
    corps += `${l.nom} x ${l.qte} — PU ${l.prixApplique} CFP — Ligne ${l.totalLigne} CFP\n`;
  });
  corps += `\nTotal HT : ${totalHT} CFP\nTVA (16%) : ${tva} CFP\nTOTAL TTC : ${totalTTC} CFP`;
  const sujet = "Commande de " + client;
  window.location.href = `mailto:tiisouvenirs@gmail.com?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
}

afficherProduits();
majAffichage();
</script>
</body>
</html>
