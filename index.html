  <meta charset="UTF-8" />

  <title>Commande Souvenirs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
    }
    .categorie {
      margin-top: 40px;
    }
    .produits {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: stretch; /* toutes les cartes de la ligne s'étirent à la même hauteur */
    }
    .produit {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 8px;
      width: 150px;
      /* pas de hauteur fixe : la carte s'étire seulement autant que nécessaire */
      text-align: center;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .produit-image {
      width: 100%;
      height: 150px;              /* zone image plus grande, même taille pour tous */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .produit img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;        /* l'image garde ses proportions sans déformer la grille */
    }
    .produit-nom {
      font-size: 0.85em;
      line-height: 1.2;
      min-height: 2.1em;          /* réserve la place de 2 lignes courtes seulement */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex-shrink: 0;
    }
    .produit-prix {
      font-weight: bold;
      margin: 2px 0;
      flex-shrink: 0;
    }
    .produit-bas {
      margin-top: auto;           /* pousse toujours le bloc quantité/rupture tout en bas de la carte */
      flex-shrink: 0;
      padding-top: 4px;
    }
    .stock-info {
      color: red;
      font-size: 0.85em;
      margin: 2px 0;
    }
    .rupture-stock {
      color: red;
      font-weight: bold;
      font-size: 0.85em;
      margin-top: 6px;
      border: 1px solid red;
      border-radius: 4px;
      padding: 4px 2px;
      background: #ffecec;
    }
    .quantity-input {
      width: 60px;
      margin-top: 6px;
    }
    .quantity-input.qty-error {
      border: 1px solid red;
      background: #ffecec;
    }
    .client-select, .total, .export {
      text-align: center;
      margin-top: 20px;
    }
    .total {
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

  <script>
    const container = document.getElementById("produitsContainer");
    const totalEl = document.getElementById("total");

    function extraireStock(nom) {
      const match = nom.match(/\(\s*Stock\s*=\s*(\d+)\s*\)/i);
      return match ? parseInt(match[1]) : null;
    }

    function nettoyerNom(nom) {
      return nom.replace(/\s*\(\s*Stock\s*=\s*\d+\s*\)/gi, "").trim();
    }

    function afficherProduits() {
      const categories = {};
      produits.forEach(p => {
        if (!categories[p.categorie]) categories[p.categorie] = [];
        categories[p.categorie].push(p);
      });

      for (const [categorie, liste] of Object.entries(categories)) {
        const section = document.createElement("div");
        section.className = "categorie";
        const titre = document.createElement("h2");
        titre.textContent = categorie;
        section.appendChild(titre);

        const zone = document.createElement("div");
        zone.className = "produits";

        liste.forEach(produit => {
          const div = document.createElement("div");
          div.className = "produit";

          // Zone image à taille fixe
          const imgWrap = document.createElement("div");
          imgWrap.className = "produit-image";
          const img = document.createElement("img");
          img.src = produit.image;
          img.alt = produit.nom;
          imgWrap.appendChild(img);

          const stock = extraireStock(produit.nom);
          const nomAffiche = nettoyerNom(produit.nom);
          const enRupture = stock === 0;

          const nom = document.createElement("div");
          nom.className = "produit-nom";
          nom.textContent = nomAffiche;

          const prix = document.createElement("div");
          prix.className = "produit-prix";
          prix.textContent = produit.prix + " CFP";

          div.appendChild(imgWrap);
          div.appendChild(nom);
          div.appendChild(prix);

          // Bloc du bas (stock/quantité ou rupture) toujours aligné en bas de la carte
          const bas = document.createElement("div");
          bas.className = "produit-bas";

          if (stock !== null && stock > 0) {
            const stockDiv = document.createElement("div");
            stockDiv.className = "stock-info";
            stockDiv.textContent = "Stock : " + stock;
            bas.appendChild(stockDiv);
          }

          if (enRupture) {
            const ruptureDiv = document.createElement("div");
            ruptureDiv.className = "rupture-stock";
            ruptureDiv.textContent = "REASSORT EN COURS";
            bas.appendChild(ruptureDiv);
          } else {
            const input = document.createElement("input");
            input.type = "number";
            input.min = "0";
            input.value = "0";
            input.className = "quantity-input";
            input.dataset.id = produit.id;
            // Si un stock est affiché, on empêche de commander plus que ce stock
            if (stock !== null && stock > 0) {
              input.max = stock;
              input.dataset.maxStock = stock;
            }
            input.addEventListener("input", function () {
              limiterQuantite(this);
              calculerTotal();
            });
            bas.appendChild(input);

            const erreurDiv = document.createElement("div");
            erreurDiv.className = "qty-error-msg";
            erreurDiv.style.color = "red";
            erreurDiv.style.fontSize = "0.75em";
            erreurDiv.style.display = "none";
            erreurDiv.textContent = "Quantité max atteinte";
            bas.appendChild(erreurDiv);
          }

          div.appendChild(bas);
          zone.appendChild(div);
        });

        section.appendChild(zone);
        container.appendChild(section);
      }
    }

    // Empêche de saisir une quantité supérieure au stock disponible (quand un stock est affiché)
    function limiterQuantite(input) {
      const max = input.dataset.maxStock ? parseInt(input.dataset.maxStock) : null;
      let valeur = parseInt(input.value);

      if (isNaN(valeur) || valeur < 0) {
        valeur = 0;
      }

      const erreurDiv = input.parentElement.querySelector(".qty-error-msg");

      if (max !== null && valeur > max) {
        valeur = max;
        if (erreurDiv) erreurDiv.style.display = "block";
        input.classList.add("qty-error");
      } else {
        if (erreurDiv) erreurDiv.style.display = "none";
        input.classList.remove("qty-error");
      }

      input.value = valeur;
    }

    function calculerTotal() {
      let total = 0;
      const inputs = document.querySelectorAll(".quantity-input");
      inputs.forEach(input => {
        const id = parseInt(input.dataset.id);
        const produit = produits.find(p => p.id === id);
        const qte = parseInt(input.value || "0");
        total += qte * produit.prix;
      });
      totalEl.textContent = "Total : " + total + " CFP";
    }

    async function exportPDF() {
      const client = document.getElementById('client').value;
      if (!client) {
        alert('Veuillez sélectionner un client.');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      let y = 10;
      doc.text('Client : ' + client, 10, y);
      y += 10;

      let total = 0;
      const quantityInputs = document.querySelectorAll('.quantity-input');
      quantityInputs.forEach(input => {
        const quantity = parseInt(input.value) || 0;
        if (quantity > 0) {
          const id = parseInt(input.dataset.id);
          const produit = produits.find(p => p.id === id);
          const nomPropre = nettoyerNom(produit.nom);
          const lineTotal = quantity * produit.prix;
          total += lineTotal;
          doc.text(`${nomPropre} x ${quantity} = ${lineTotal} CFP`, 10, y);
          y += 10;
          if (y > 280) {
            doc.addPage();
            y = 10;
          }
        }
      });

      doc.text('Total : ' + total + ' CFP', 10, y + 10);
      doc.save('commande_' + client.replace(/\s+/g, '_') + '.pdf');
    }

    function envoyerCommande() {
      const client = document.getElementById('client').value;
      if (!client) {
        alert('Veuillez sélectionner un client.');
        return;
      }

      const commande = [];
      const inputs = document.querySelectorAll(".quantity-input");

      inputs.forEach(input => {
        const quantity = parseInt(input.value) || 0;
        if (quantity > 0) {
          const id = parseInt(input.dataset.id);
          const produit = produits.find(p => p.id === id);
          if (produit) {
            commande.push({
              produit: nettoyerNom(produit.nom),
              quantite: quantity,
              prix: produit.prix
            });
          }
        }
      });

      if (commande.length === 0) {
        alert("Aucun produit sélectionné.");
        return;
      }

      let email = "sarlcpie@gmail.com";
      let sujet = "Commande de " + client;
      let corps = "Commande de : " + client + "\n\n";

      commande.forEach(item => {
        corps += `${item.produit} x ${item.quantite} = ${item.quantite * item.prix} CFP\n`;
      });

      corps += `\nTotal : ${commande.reduce((sum, item) => sum + item.quantite * item.prix, 0)} CFP`;

      let mailtoLink = `mailto:${email}?subject=${encodeURIComponent(sujet)}&body=${encodeURIComponent(corps)}`;
      window.location.href = mailtoLink;
    }

    afficherProduits();
  </script>
